<html lang="hu">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nagy Számok Cockpit — Állapot-alapú Illusztrációk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        :root {
            --bg-dark: #0a0d14;
            --panel-bg: rgba(18, 24, 38, 0.85);
            --border-color: rgba(255, 255, 255, 0.12);
            --accent-cyan: #38bdf8;
            --accent-purple: #c084fc;
            --accent-gold: #fbbf24;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Outfit', -apple-system, sans-serif;
            min-height: 100vh;
            padding: 1.25rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .cockpit-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0.9rem 1.25rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .compact-toolbar {
            display: grid;
            grid-template-columns: auto auto 1fr auto auto;
            gap: 1rem;
            align-items: center;
        }

        @media (max-width: 820px) {
            .compact-toolbar {
                grid-template-columns: 1fr;
                gap: 0.85rem;
            }
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .control-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            font-weight: 600;
            display: flex;
            justify-content: space-between;
        }

        .pill-selector {
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            padding: 3px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .pill-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.35rem 0.65rem;
            font-size: 0.82rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: 'JetBrains Mono', monospace;
        }

        .pill-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
        }

        .pill-btn.active {
            background: var(--accent-cyan);
            color: #000;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .v2-group .pill-btn.active {
            background: var(--accent-purple);
            color: #000;
            box-shadow: 0 0 12px rgba(192, 132, 252, 0.4);
        }

        .slider-wrap {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .custom-slider {
            flex: 1;
            accent-color: var(--accent-gold);
            height: 6px;
            cursor: pointer;
        }

        .slider-val-badge {
            font-family: 'JetBrains Mono', monospace;
            background: rgba(251, 191, 36, 0.15);
            color: var(--accent-gold);
            border: 1px solid rgba(251, 191, 36, 0.3);
            padding: 0.2rem 0.55rem;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.9rem;
            min-width: 36px;
            text-align: center;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-main);
            padding: 0.35rem 0.65rem;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: 'Outfit', sans-serif;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .nav-btn:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: var(--accent-cyan);
            color: #ffffff;
        }

        .step-group {
            display: flex;
            gap: 0.4rem;
            align-items: flex-end;
        }

        .hero-number-panel {
            text-align: center;
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, rgba(56, 189, 248, 0.08) 0%, rgba(10, 13, 20, 0.6) 100%);
            border: 1px solid rgba(56, 189, 248, 0.25);
            min-height: 120px;
        }

        .tower-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(2.2rem, 6vw, 4.2rem);
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 24px rgba(56, 189, 248, 0.5);
            word-break: break-all;
            line-height: 1.1;
        }

        .illustrations-section {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .section-header {
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent-gold);
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 0.2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .illustrations-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .illustration-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-left: 4px solid var(--accent-gold);
            border-radius: 10px;
            padding: 0.85rem 1.1rem;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            transition: transform 0.15s ease, background 0.15s ease;
        }

        .illustration-card:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-1px);
        }

        .card-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
        }

        .card-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            font-weight: 700;
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-cyan);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }

        .card-badge .mjx-chtml {
            margin: 0 !important;
            color: var(--accent-cyan) !important;
        }

        .card-desc {
            font-size: 0.88rem;
            color: var(--text-main);
            line-height: 1.45;
        }

        .card-desc b {
            color: var(--accent-gold);
        }

        .empty-state {
            padding: 1.5rem 1rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.88rem;
            font-style: italic;
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed rgba(255, 255, 255, 0.12);
            border-radius: 10px;
        }

        .shortcut-hints {
            display: flex;
            justify-content: center;
            gap: 1rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.2rem;
        }

        .shortcut-hints kbd {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            padding: 0.1rem 0.35rem;
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent-cyan);
        }
    </style>
</head>
<body>

    <div class="cockpit-container">

        <!-- 1. KOMPAKT VEZÉRLŐSÁV -->
        <div class="glass-panel compact-toolbar">

            <!-- VÁLTÓ 1 -->
            <div class="control-group">
                <div class="control-label">
                    <span data-i18n="v1_title">Váltó 1 (Torony)</span>
                    <span id="v1-desc" style="color: var(--accent-cyan)">1-szintes</span>
                </div>
                <div class="pill-selector">
                    <button class="pill-btn active" onclick="handlePillV1(1)">1</button>
                    <button class="pill-btn" onclick="handlePillV1(2)">2</button>
                    <button class="pill-btn" onclick="handlePillV1(3)">3</button>
                    <button class="pill-btn" onclick="handlePillV1(4)">4</button>
                </div>
            </div>

            <!-- VÁLTÓ 2 -->
            <div class="control-group v2-group">
                <div class="control-label">
                    <span data-i18n="v2_title">Váltó 2 (Lépték)</span>
                    <span id="v2-desc" style="color: var(--accent-purple)">×1</span>
                </div>
                <div class="pill-selector">
                    <button class="pill-btn active" onclick="handlePillV2(1)">1</button>
                    <button class="pill-btn" onclick="handlePillV2(2)">2</button>
                    <button class="pill-btn" onclick="handlePillV2(3)">3</button>
                </div>
            </div>

            <!-- CSÚSZKA -->
            <div class="control-group">
                <div class="control-label">
                    <span data-i18n="slider_title">Gázpedál (Csúszka x)</span>
                    <span>1 ... 10</span>
                </div>
                <div class="slider-wrap">
                    <input type="range" id="x-slider" class="custom-slider" min="1" max="10" value="1" step="1" oninput="handleSliderChange()">
                    <div id="slider-val" class="slider-val-badge">1</div>
                </div>
            </div>

            <!-- NYELV VÁLASZTÓ -->
            <div class="control-group">
                <div class="control-label">
                    <span data-i18n="lang_title">Nyelv / Lang</span>
                </div>
                <div class="pill-selector">
                    <button class="pill-btn active" id="lang-hu-btn" onclick="setLanguage('hu')">HU</button>
                    <button class="pill-btn" id="lang-en-btn" onclick="setLanguage('en')">EN</button>
                </div>
            </div>

            <!-- Léptető gombok -->
            <div class="control-group">
                <div class="control-label">
                    <span data-i18n="step_title">Léptetés</span>
                </div>
                <div class="step-group">
                    <button class="nav-btn" onclick="stepPrev()" title="Előző fokozat (Bal nyíl)">◀</button>
                    <button class="nav-btn" onclick="stepNext()" title="Következő fokozat (Jobb nyíl)">▶</button>
                </div>
            </div>

        </div>

        <!-- 2. KÖZVETLEN ALATTA LÉVŐ SZÁM-KIJELZŐ -->
        <div class="glass-panel hero-number-panel">
            <div id="tower-output" class="tower-display">$$1$$</div>
        </div>

        <!-- 3. DINAMIKUS ILLUSZTRÁCIÓK LISTÁJA -->
        <div class="glass-panel illustrations-section">
            <div class="section-header">
                <span data-i18n="section_title">📍 Illusztrációk ezen a nagyságrenden</span>
                <span id="range-badge" style="color: var(--text-muted); font-size: 0.75rem;"></span>
            </div>

            <div id="illustrations-container" class="illustrations-list">
                <!-- JS tölti fel a szűrt kártyákkal -->
            </div>
        </div>

        <div class="shortcut-hints">
            <span data-i18n="hint_step"><kbd>←</kbd> / <kbd>→</kbd> Léptetés egyesével</span>
            <span data-i18n="hint_home"><kbd>Home</kbd> Ugrás az elejére (1)</span>
            <span data-i18n="hint_end"><kbd>End</kbd> Ugrás a végére</span>
        </div>

    </div>

           I18N DICTIONARIES & LANGUAGE STATE
           ========================================================================= */

        function getText(val) {
            if (val && typeof val === 'object') {
                return val[currentLang] || val['hu'] || '';
            }
            return val || '';
        }

        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById('lang-hu-btn').classList.toggle('active', lang === 'hu');
            document.getElementById('lang-en-btn').classList.toggle('active', lang === 'en');
            
            document.querySelectorAll('[data-i18n]').forEach(elem => {
                const key = elem.getAttribute('data-i18n');
                if (UI_TEXTS[lang][key]) {
                    elem.innerHTML = UI_TEXTS[lang][key];
                }
            });

            updatePillUI(currentState.v1, currentState.v2);

        /* =========================================================================
           STATE MANAGEMENT & NAVIGATION LOGIC
           ========================================================================= */
        function isStateSkipped(v1Val, v2Val, xVal) {
            if (v1Val === 1 && v2Val === 2 && xVal === 1) return true;
            if (v1Val === 1 && v2Val === 3 && xVal === 1) return true;

            if (v1Val === 2 && v2Val === 1 && xVal <= 3) return true;
            if (v1Val === 2 && v2Val === 2 && xVal === 1) return true;
            if (v1Val === 2 && v2Val === 3 && xVal === 1) return true;

            if (v1Val === 3 && v2Val === 1 && xVal <= 3) return true;
            if (v1Val === 3 && v2Val === 2 && xVal === 1) return true;
            if (v1Val === 3 && v2Val === 3 && xVal === 1) return true;

            if (v1Val === 4 && v2Val === 1 && xVal <= 3) return true;
            if (v1Val === 4 && v2Val === 2 && xVal === 1) return true;
            if (v1Val === 4 && v2Val === 3 && xVal === 1) return true;

            return false;
        }

        function buildValidStates() {
            const list = [];
            for (let v1Val = 1; v1Val <= 4; v1Val++) {
                for (let v2Val = 1; v2Val <= 3; v2Val++) {
                    for (let xVal = 1; xVal <= 10; xVal++) {
                        if (!isStateSkipped(v1Val, v2Val, xVal)) {
                            list.push({ v1: v1Val, v2: v2Val, x: xVal });
                        }
                    }
                }
            }
            return list;
        }

        const VALID_STATES = buildValidStates();
        let currentState = { v1: 1, v2: 1, x: 1 };

        function getStateScore(st) {
            const val = st.x * Math.pow(10, st.v2 - 1);
            if (st.v1 === 1) {
                return Math.log10(val);
            } else if (st.v1 === 2) {
                return val;
            } else if (st.v1 === 3) {
                return 1000 + val;
            } else if (st.v1 === 4) {
                return 2000 + val;
            }
            return 0;
        }

        function getCurrentStateIndex() {
            const exactIdx = VALID_STATES.findIndex(st => st.v1 === currentState.v1 && st.v2 === currentState.v2 && st.x === currentState.x);
            if (exactIdx !== -1) return exactIdx;

            const targetScore = getStateScore(currentState);
            let bestIdx = 0;
            let minDiff = Infinity;

            VALID_STATES.forEach((st, idx) => {
                const diff = Math.abs(getStateScore(st) - targetScore);
                if (diff < minDiff) {
                    minDiff = diff;
                    bestIdx = idx;
                }
            });

            return bestIdx;
        }

        function applyStateIndex(index) {
            const safeIdx = Math.max(0, Math.min(VALID_STATES.length - 1, index));
            currentState = { ...VALID_STATES[safeIdx] };
            updateUI();
        }

        function handlePillV1(val) {
            currentState.v1 = val;
            updateUI();
        }

        function handlePillV2(val) {
            currentState.v2 = val;
            updateUI();
        }

        function handleSliderChange() {
            currentState.x = parseInt(document.getElementById('x-slider').value);
            updateUI();
        }

        function stepNext() {
            const currentIdx = getCurrentStateIndex();
            applyStateIndex(currentIdx + 1);
        }

        function stepPrev() {
            const currentIdx = getCurrentStateIndex();
            applyStateIndex(currentIdx - 1);
        }

        function goHome() {
            applyStateIndex(0);
        }

        function goEnd() {
            applyStateIndex(VALID_STATES.length - 1);
        }

        /* Keyboard Event Listener */
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                stepPrev();
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                stepNext();
            } else if (e.key === 'Home') {
                e.preventDefault();
                goHome();
            } else if (e.key === 'End') {
                e.preventDefault();
                goEnd();
            }
        });

        function updateUI() {
            document.getElementById('x-slider').value = currentState.x;
            updatePillUI(currentState.v1, currentState.v2);
            renderCalculations(currentState);
        }

        function updatePillUI(v1Val, v2Val) {
            document.querySelectorAll('.control-group:nth-child(1) .pill-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx + 1 === v1Val);
            });
            document.getElementById('v1-desc').innerText = UI_TEXTS[currentLang].v1_descs[v1Val - 1];

            document.querySelectorAll('.v2-group .pill-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx + 1 === v2Val);
            });
            document.getElementById('v2-desc').innerText = UI_TEXTS[currentLang].v2_descs[v2Val - 1];
        }

        function renderCalculations(st) {
            document.getElementById('slider-val').innerText = st.x;

            const scaleMultiplier = Math.pow(10, st.v2 - 1);
            const expVal = scaleMultiplier * st.x;

            let outputHtml = '';
            if (st.v1 === 1) {
                outputHtml = `$$${expVal.toLocaleString(currentLang === 'hu' ? 'hu-HU' : 'en-US')}$$`;
            } else if (st.v1 === 2) {
                outputHtml = `$$10^{${expVal}}$$`;
            } else if (st.v1 === 3) {
                outputHtml = `$$10^{10^{${expVal}}}$$`;
            } else if (st.v1 === 4) {
                outputHtml = `$$10^{10^{10^{${expVal}}}}$$`;
            }

            const towerElem = document.getElementById('tower-output');
            towerElem.innerHTML = outputHtml;

            /* Filter matching illustrations for state */
            const matchingIllustrations = ILLUSTRATIONS.filter(item => {
                return item.targets.some(t => t.v1 === st.v1 && t.v2 === st.v2 && t.x === st.x);
            });

            matchingIllustrations.sort((a, b) => (a.sortVal || 0) - (b.sortVal || 0));

            const container = document.getElementById('illustrations-container');
            const rangeBadge = document.getElementById('range-badge');

            rangeBadge.innerText = `${UI_TEXTS[currentLang].gear_prefix}(${st.v1}, ${st.v2}, ${st.x})`;

            if (matchingIllustrations.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        ${UI_TEXTS[currentLang].empty_state}
                    </div>
                `;
            } else {
                container.innerHTML = matchingIllustrations.map(item => `
                    <div class="illustration-card">
                        <div class="card-top-row">
                            <span class="card-title">${getText(item.title)}</span>
                            <span class="card-badge">${getText(item.badge)}</span>
                        </div>
                        <div class="card-desc">${getText(item.desc)}</div>
                    </div>
                `).join('');
            }

            /* MathJax re-render */
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise([towerElem, container]).catch((err) => console.error(err));
            }
        }

        // Initialize
        setLanguage('hu');
    </script>
